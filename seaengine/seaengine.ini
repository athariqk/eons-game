[WindowSettings]
SizeWidth = 1366
SizeHeight = 768
; Window modes: 0 = Windowed, 1 = Maximized, 2 = Fullscreen
Mode = 1
PixelsPerMeter = 32

[RenderSettings]
VSync = false

[Water]
Roughness = 0.4
NormalStrength = 1.0
EnvStrength = 0.5
; waterColor.a is the base surface opacity.
WaterColor = 0, 4, 6, 128
FoamColor = 186, 171, 158, 255
; Beer-Lambert extinction per channel (1/m); red is absorbed fastest.
Absorption = 0.18, 0.10, 0.06

; Endless-horizon radial water mesh (camera-centered single mesh). Sizes in meters.
; The mesh is kept strictly inside the camera far plane so its outer
; ring never coincides with the far plane / skybox and z-fights.
HorizonRadius = 450000
HorizonRings = 240
HorizonSegments = 160
RingGrowth = 1.10
InnerRadius = 3.0
; Uniform ring spacing out to NearRadius (dense near field), then geometric growth.
NearRadius = 600
NearSpacing = 4.0
; scale horizon fade by camera's z-far, ranged 0-1
HorizonFadeScale = 0.15

; Wave cascades. tile length/meters, wind m/s, fetch km, foam 0-10.
[Water.Cascade0]
TileLength = 1000
WindSpeed = 35
WindDirection = 25
FetchLength = 175
Swell = 0.8
Spread = 0.286
Detail = 1.0
Whitecap = 0.5
FoamAmount = 4.312
DisplacementScale = 1.0
NormalScale = 1.0

[Log]
; Levels are: 0 = Trace, 1 = Debug, 2 = Info, 3 = Warning, 4 = Error, 5 = Critical
Level = 1
FilePath = logs/seaengine.log
; You can override individual engine modules by specifying them in the Overrides field,
; using the format "channel:level". For instance: "phys:2, render:4" sets the log level
; for the "phys" module to 2 (Info) and the "render" category to 4 (Error)
; available channels include: audio, ecs, evts, graphs, gui, phys, io
Overrides = phys:3
