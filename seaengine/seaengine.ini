[WindowSettings]
size_width = 1366
size_height = 768
; Window modes: 0 = Windowed, 1 = Maximized, 2 = Fullscreen
mode = 1
pixels_per_meter = 32

[RenderSettings]
vsync = false

[Water]
cells = 64
levels = 0
base_spacing = 3.5
horizon = 450000.0
; Quads per frustum-culled chunk side per level (rounded to a divisor of Cells).
; Lower = finer culling granularity, more draw calls. 0 or >= Cells = one chunk per level.
chunk_cells = 16
morph_transition_width = 0.1
roughness = 0.4
normal_strength = 1.0
env_strength = 0.5
; waterColor.a is the base surface opacity.
water_color = 0, 4, 6, 128
foam_color = 186, 171, 158, 255
; Beer-Lambert extinction per channel (1/m); red is absorbed fastest.
absorption = 0.18, 0.10, 0.06
; scale horizon fade by camera's z-far, ranged 0-1
horizon_fade_scale = 0.15

[Water.Cascade0]
tile_length = 1000
wind_speed = 35
wind_direction = 25
fetch_length = 175
swell = 0.8
spread = 0.286
detail = 1.0
whitecap = 0.5
foam_amount = 4.312
displacement_scale = 1.0
normal_scale = 1.0

[Log]
; Levels are: 0 = Trace, 1 = Debug, 2 = Info, 3 = Warning, 4 = Error, 5 = Critical
level = 1
file_path = logs/seaengine.log
; You can override individual engine modules by specifying them in the Overrides field,
; using the format "channel:level". For instance: "phys:2, render:4" sets the log level
; for the "phys" module to 2 (Info) and the "render" category to 4 (Error)
; available channels include: audio, ecs, evts, graphs, gui, phys, io
overrides = phys:3

[Assets]
; Raw asset source directories used by the editor's Reimport action.
; ';'-separated, in pipeline order (later dirs win over earlier ones).
; Absolute, or relative to the working directory. Absent/empty = auto-detect the
; repository layout by walking up from the working directory.
; SourceDirs = C:/dev/eons/ncore/assets;C:/dev/eons/eons-game/assets;C:/dev/eons/seaengine/assets
